---
# Builds the Windows installer and portable zip on every push.
name: Build Windows

on:
  push:
    branches: ['**']
    # Documentation-only pushes do not need a build
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  # Let a running build finish; a newer push waits its turn instead of restarting it
  cancel-in-progress: false

jobs:
  build:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      BRANCH: ${{ github.ref_name }}
      BUILD_VERSION: 0.1.${{ github.run_number }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules needed on Windows
        shell: bash
        run: |
          git submodule update --init --recursive --depth 1 \
            third-party/build-deps \
            third-party/libdisplaydevice \
            third-party/moonlight-common-c \
            third-party/nanors \
            third-party/nv-codec-headers \
            third-party/nvapi-open-source-sdk \
            third-party/Simple-Web-Server \
            third-party/tray \
            third-party/ViGEmClient

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The virtual display driver binary (SudoVDA.dll) and its installer tool (nefconc.exe) are not
      # in the source tree; Apollo adds them when it builds releases. Take the complete signed driver
      # package from Apollo's official installer, pinned by the checksum GitHub publishes for it, so
      # the driver files all come from one signed set.
      - name: Fetch the virtual display driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/ClassicOldSong/Apollo/releases/download/v0.4.6/Apollo-0.4.6.exe'
          $expected = '42b2aefaacb3474511517a56b96ee9f0517f30ac38b5dd2fda9fd5b478f5021a'
          $installer = Join-Path $env:RUNNER_TEMP 'Apollo-0.4.6.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($actual -ne $expected) { throw "Apollo installer checksum mismatch: $actual" }

          $extract = Join-Path $env:RUNNER_TEMP 'apollo'
          & 7z x $installer "-o$extract" -y | Out-Null
          $dll = Get-ChildItem -Path $extract -Recurse -Filter 'SudoVDA.dll' | Select-Object -First 1
          if (-not $dll) { throw 'SudoVDA.dll not found in the Apollo installer' }
          $source = $dll.Directory.FullName
          Write-Host "Driver package found in $source"
          Get-ChildItem $source | Format-Table Name, Length

          $target = 'src_assets/windows/drivers/sudovda'
          foreach ($name in 'SudoVDA.dll', 'SudoVDA.inf', 'sudovda.cat', 'nefconc.exe') {
            $file = Get-ChildItem -Path $source -Filter $name | Select-Object -First 1
            if (-not $file) { throw "$name missing from the driver package" }
            Copy-Item $file.FullName (Join-Path $target $file.Name) -Force
          }
          # The certificate is optional in the package; keep ours if it isn't there
          $cer = Get-ChildItem -Path $source -Filter 'sudovda.cer' | Select-Object -First 1
          if ($cer) { Copy-Item $cer.FullName (Join-Path $target 'sudovda.cer') -Force }
          Get-ChildItem $target | Format-Table Name, Length

      - name: Record Node.js location
        shell: pwsh
        run: |
          $dir = Split-Path (Get-Command node).Source
          "NODE_DIR=$dir" >> $env:GITHUB_ENV

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann_json
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain

      - name: Configure
        shell: msys2 {0}
        run: |
          set -o pipefail
          export PATH="$PATH:$(cygpath -u "$NODE_DIR")"
          node --version
          gcc --version | head -n 1
          cmake -B build -G Ninja -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF 2>&1 | tee configure.log

      - name: Build
        shell: msys2 {0}
        run: |
          set -o pipefail
          export PATH="$PATH:$(cygpath -u "$NODE_DIR")"
          # -k 0 keeps going after a failure so one run reports every error
          ninja -C build -k 0 2>&1 | tee build.log

      - name: Package
        shell: msys2 {0}
        run: |
          set -o pipefail
          cd build
          cpack -G NSIS 2>&1 | tee ../package.log
          cpack -G ZIP 2>&1 | tee -a ../package.log
          ls -la cpack_artifacts
          # Should stay the same across builds while its source and the toolchain don't change
          echo "tunastreamsvc.exe sha256: $(sha256sum tools/tunastreamsvc.exe | cut -d' ' -f1)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build/cpack_artifacts/*.exe
            build/cpack_artifacts/*.zip
          if-no-files-found: error

      - name: Smoke test
        # Starts the packaged program on this machine and checks that it serves its web
        # interface and that TunaStream's own settings and actions respond. Runs after the
        # upload so a failing test still leaves an installer to inspect.
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci/smoke-test.sh build/cpack_artifacts/*.zip "$PWD" "$BUILD_VERSION" 2>&1 | tee smoke.log

      - name: Report smoke test summary
        if: success()
        shell: bash
        run: |
          passed=$(grep -c "^PASS:" smoke.log || true)
          msg=$(grep -E "^(PASS|RESULT):|Warning:|Error:|Fatal:" smoke.log | cut -c1-200 | head -n 70 | sed -e 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Smoke test passed ($passed checks)::$msg"

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          # Publish the tail of whichever log failed as an annotation, so the
          # cause is visible without downloading the full log.
          for f in smoke.log package.log build.log configure.log; do
            if [ -f "$f" ]; then log="$f"; break; fi
          done
          if [ -z "${log:-}" ]; then echo "::error::Failed before any log was written"; exit 0; fi
          {
            grep -n -E "^FAIL:|error:|error |FAILED:|undefined reference|No such file|CMake Error" "$log" | head -n 60
            echo "--- last lines of $log ---"
            tail -n 45 "$log"
          } | cut -c1-260 > excerpt.txt
          msg=$(sed -e 's/%/%25/g' excerpt.txt | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::error title=$log::$msg"

  web-preview:
    # Publishes the built web UI to the web-preview branch so its pages can be
    # opened and reviewed without installing a build.
    name: Web UI preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web UI
        run: |
          npm install
          npm run build

      - name: Push to web-preview branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd build/assets/web
          git init -q -b web-preview
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Web UI build for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-preview

  release:
    # Every successful build of master is published as a release, so the installer can be
    # downloaded without signing in to GitHub, and the update check in the app can see it.
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Name the files after the version
        run: |
          cd dist
          ls -la
          for f in *.exe; do mv "$f" "TunaStream-${VERSION}-setup.exe"; done
          for f in *.zip; do mv "$f" "TunaStream-${VERSION}-portable.zip"; done
          ls -la

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automatic build from master, commit ${GITHUB_SHA::7}."
            echo
            echo "**Download** \`TunaStream-${VERSION}-setup.exe\` and run it. Windows warns about an unknown"
            echo "publisher because the installer is not code-signed: choose **More info**, then **Run anyway**."
            echo
            echo "The portable zip runs without installing, but does not set up the virtual display or"
            echo "virtual gamepad drivers."
            echo
            echo "### Changes"
            git_log=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits?sha=${GITHUB_SHA}&per_page=15" \
              | python3 -c "import json,sys; [print('- ' + c['commit']['message'].split(chr(10))[0]) for c in json.load(sys.stdin) if not c['commit']['message'].startswith('Merge')]" || true)
            echo "${git_log}"
          } > notes.md
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "TunaStream ${VERSION}" \
            --notes-file notes.md \
            --latest
