---
# Builds the Windows installer and portable zip on every push.
name: Build Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      BRANCH: ${{ github.ref_name }}
      BUILD_VERSION: 0.1.${{ github.run_number }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules needed on Windows
        shell: bash
        run: |
          git submodule update --init --recursive --depth 1 \
            third-party/build-deps \
            third-party/libdisplaydevice \
            third-party/moonlight-common-c \
            third-party/nanors \
            third-party/nv-codec-headers \
            third-party/nvapi-open-source-sdk \
            third-party/Simple-Web-Server \
            third-party/tray \
            third-party/ViGEmClient

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record Node.js location
        shell: pwsh
        run: |
          $dir = Split-Path (Get-Command node).Source
          "NODE_DIR=$dir" >> $env:GITHUB_ENV

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann_json
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain

      - name: Configure
        shell: msys2 {0}
        run: |
          set -o pipefail
          export PATH="$PATH:$(cygpath -u "$NODE_DIR")"
          node --version
          gcc --version | head -n 1
          cmake -B build -G Ninja -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF 2>&1 | tee configure.log

      - name: Build
        shell: msys2 {0}
        run: |
          set -o pipefail
          export PATH="$PATH:$(cygpath -u "$NODE_DIR")"
          # -k 0 keeps going after a failure so one run reports every error
          ninja -C build -k 0 2>&1 | tee build.log

      - name: Package
        shell: msys2 {0}
        run: |
          set -o pipefail
          cd build
          cpack -G NSIS 2>&1 | tee ../package.log
          cpack -G ZIP 2>&1 | tee -a ../package.log
          ls -la cpack_artifacts

      - name: Report errors
        if: failure()
        shell: bash
        run: |
          # Publish the tail of whichever log failed as an annotation, so the
          # cause is visible without downloading the full log.
          for f in package.log build.log configure.log; do
            if [ -f "$f" ]; then log="$f"; break; fi
          done
          if [ -z "${log:-}" ]; then echo "::error::Failed before any log was written"; exit 0; fi
          {
            grep -n -E "error:|error |FAILED:|undefined reference|No such file|CMake Error" "$log" | head -n 60
            echo "--- last lines of $log ---"
            tail -n 40 "$log"
          } | cut -c1-260 > excerpt.txt
          msg=$(sed -e 's/%/%25/g' excerpt.txt | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::error title=$log::$msg"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build/cpack_artifacts/*.exe
            build/cpack_artifacts/*.zip
          if-no-files-found: error

  web-preview:
    # Publishes the built web UI to the web-preview branch so its pages can be
    # opened and reviewed without installing a build.
    name: Web UI preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web UI
        run: |
          npm install
          npm run build

      - name: Push to web-preview branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd build/assets/web
          git init -q -b web-preview
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Web UI build for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-preview
